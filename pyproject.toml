[project]
name = "q-gunter"
version = "1.0.0"
description = "Q-Gunter — AI-powered autonomous penetration testing agent by Q-Gunter team"
authors = [{ name = "Q-Gunter Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<4.0"
keywords = ["penetration-testing", "security", "ai", "claude", "ctf"]
dependencies = [
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.75.0",
]

[project.scripts]
q-gunter = "qgunter.interface.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qgunter"]

# === uv: dependencias de desarrollo ===
[tool.uv]
dev-dependencies = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]

# === Ruff: linter y formateador ===
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# === MyPy: type checking ===
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*"]
ignore_missing_imports = true

# === Pytest ===
[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
